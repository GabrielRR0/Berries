<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Berries" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Sin manifest ni iconos, Android nunca ofrece "instalar" la app en modo
         standalone (solo un acceso directo que abre en una pestaña normal) -
         y sin modo standalone, la barra de estado nunca combina con el color
         de la app, sin importar el theme-color de arriba. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Berries</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
